plugins { id 'com.android.application' }
android {
    namespace 'io.github.weimanmk.easygot'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'io.github.weimanmk.easygot'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-alpha.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('SIGNING_STORE_FILE'))
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            debuggable false
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            if (System.getenv('SIGNING_STORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {}
