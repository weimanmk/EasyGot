plugins { id 'com.android.application' }
android {
    namespace 'io.github.weimanmk.easygot'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.weimanmk.easygot'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('SIGNING_STORE_FILE'))
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release {
            if (System.getenv('SIGNING_STORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
