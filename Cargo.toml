[package]
name = "easygot"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "2.12", features = ["json"], default-features = true }
url = "2.5"
quick-xml = "0.37"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "accessibility"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
android_logger = "0.14"
log = "0.4"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-2", "renderer-software", "unstable-fontique-011"] }
i-slint-core = { version = "=1.18.1", optional = true, features = ["image-decoders", "svg"] }

[features]
ui-check = ["dep:slint", "dep:i-slint-core"]

[build-dependencies]
slint-build = "=1.18.1"

[[example]]
name = "render_ui"
required-features = ["ui-check"]
